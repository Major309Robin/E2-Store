name: Build Bridge EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'bridge.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko pyinstaller
      - run: pyinstaller --onefile --name E2-Bridge bridge.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge
          name: E2 Bridge (Windows)
          files: dist/E2-Bridge.exe
